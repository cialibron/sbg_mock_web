openapi: 3.0.3
info:
  title: Builders Group API
  version: 0.1.0
paths:
  /api/submit-talk:
    post:
      summary: Submit a Call for Speakers proposal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TalkSubmission'
      responses:
        '202':
          description: Accepted, waiting for email confirmation
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    TalkSubmission:
      type: object
      additionalProperties: false
      required:
        - speakerName
        - email
        - title
        - services
        - shortDescription
        - details
        - proposedStart
        - timezone
        - participants
        - creditsRequested
        - codeOfConduct
      properties:
        speakerName:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 254
        bio:
          type: string
          maxLength: 1000
        links:
          type: array
          maxItems: 5
          items:
            type: string
            format: uri
        title:
          type: string
          minLength: 5
          maxLength: 120
        services:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items:
            type: string
        shortDescription:
          type: string
          minLength: 10
          maxLength: 300
        details:
          type: string
          minLength: 20
          maxLength: 3000
        proposedStart:
          type: string
          format: date-time
        timezone:
          type: string
          example: Asia/Manila
        participants:
          type: integer
          minimum: 5
          maximum: 500
        creditsRequested:
          type: boolean
        codeOfConduct:
          type: boolean
          enum: [true]
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: validation_failed
        fields:
          type: object
          additionalProperties:
            type: string
          example:
            title: Too long